version: '3.8'

services:
  # 🌐 Django REST Backend Service
  web:
    build: .
    container_name: art_gallery_web
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
      - media_volume:/app/media
    ports:
      - '8000:8000'
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings.local
      - SECRET_KEY=django-insecure-local-dev-key
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - POSTGRES_DB=art_gallery_db
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - USE_S3=False
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - art_gallery_network

  # 🗄️ PostgreSQL Database Service
  db:
    image: postgres:15-alpine
    container_name: art_gallery_db
    restart: always
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=art_gallery_db
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - art_gallery_network

  # ⚡ Redis Service (для сесій кошика незареєстрованих користувачів та кешування)
  redis:
    image: redis:7-alpine
    container_name: art_gallery_redis
    restart: always
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    networks:
      - art_gallery_network

# 📦 Томи для збереження даних між перезапусками
volumes:
  postgres_data:
  redis_data:
  media_volume:

# 🌐 Спільна мережа для контейнерів
networks:
  art_gallery_network:
    driver: bridge
